<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAN SUNSHINE</title><style>*{box-sizing:border-box}body{margin:0;background:#151515;color:#f5f1ff;font-family:system-ui;min-height:100dvh;display:grid;place-items:center}main{width:min(480px,94vw);padding:32px;text-align:center}header,footer{color:#d5bfff;letter-spacing:2px}h1{font-size:32px}p{color:#beb6ca;line-height:1.8}.sun{font-size:88px;color:#d5bfff;text-shadow:0 0 40px #a78bda;animation:glow 4s infinite alternate}@keyframes glow{to{transform:rotate(20deg)}}select,textarea,.send{width:100%;padding:14px;border-radius:12px;font:inherit;margin:10px 0}select,textarea{background:#242128;color:white;border:1px solid #51485e}.send{background:#d5bfff;color:#151515;border:0}.stars{display:flex;justify-content:center;gap:4px;direction:ltr}.stars button{font-size:40px;background:none;border:0;color:#62596c;cursor:pointer;transition:transform .2s,color .2s}.stars button.active{color:#d5bfff;text-shadow:0 0 18px #a78bda;transform:scale(1.1)}footer{margin-top:35px;font-size:13px}.send:disabled{opacity:.5}small{color:#beb6ca}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}.wall{margin-top:44px;text-align:center}.wall h2{font-size:24px}.wall-track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin;padding:12px 0;direction:rtl}.wall-card{flex:0 0 245px;scroll-snap-align:start;background:#242128;border:1px solid #51485e;border-radius:18px;padding:18px;text-align:right}.wall-card p{font-size:14px}.wall-card span{color:#d5bfff}.wall-toggle{background:none;border:1px solid #51485e;color:#d5bfff;border-radius:20px;padding:8px 15px;font:inherit;cursor:pointer}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600&family=Reem+Kufi:wght@400;500;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"><style>body{font-family:'Alexandria',system-ui,sans-serif;font-weight:400}h1,.wall h2,#thanks h2{font-family:'Reem Kufi',system-ui,sans-serif;font-weight:500;line-height:1.6;letter-spacing:-.04em}h1{font-size:clamp(30px,8vw,44px)}header,.wall>small:first-child{font-family:'Space Grotesk',sans-serif;letter-spacing:.18em;font-weight:600}header{font-size:22px}header small{font-size:10px;letter-spacing:.22em}footer{font-family:'Reem Kufi',system-ui,sans-serif;letter-spacing:0;font-size:18px}.wall-card h3{font-weight:500;font-size:16px}p{font-weight:300;font-size:14px}.send{font-weight:500}.stars button,.sun{font-family:system-ui,sans-serif}</style><link href="https://fonts.googleapis.com/css2?family=Rakkas&display=swap" rel="stylesheet"><style>main>h1{font-family:'Rakkas','Reem Kufi',serif;font-weight:400;font-size:clamp(38px,10vw,58px);line-height:1.4;letter-spacing:0;color:#d5bfff;margin:12px 0 18px}main>h1 span{font-family:system-ui;font-size:.65em;display:inline-block;vertical-align:middle}</style><link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet"><style>main h1.signature{font-family:'Aref Ruqaa','Rakkas','Times New Roman',serif!important;font-weight:700!important;font-size:clamp(40px,10vw,60px);line-height:1.6;color:#d5bfff;letter-spacing:0}</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@dawod/thmanyah-font-web/serif-display.css"><style>main h1.signature{font-family:'Thmanyah Serif Display','Alexandria','IBM Plex Sans Arabic',sans-serif!important;font-weight:300!important;color:#fff!important;line-height:1.48!important;font-size:clamp(34px,9vw,54px);font-feature-settings:'kern' 1,'liga' 1,'calt' 1,'salt' 1;text-rendering:optimizeLegibility;overflow:visible}main h1.signature span{color:#fff!important}</style><style>main h1.signature{display:flex;align-items:center;justify-content:center;gap:.22em;margin:30px 0 12px;font-size:clamp(28px,8vw,48px)}main h1.signature .signature-text{font:inherit;display:inline;vertical-align:baseline;white-space:nowrap}main h1.signature .signature-sun{width:.78em;height:.78em;flex:none;color:#fff;transform:translateY(.06em)}</style><style>main h1.signature .signature-sun{font-family:system-ui,sans-serif!important;font-size:.88em!important;font-weight:400!important;width:auto;height:auto;line-height:1;display:inline-block;transform:none;color:#fff!important}.send-sun{font-family:system-ui,sans-serif;font-size:1.65em;line-height:1;display:inline-block;vertical-align:middle;margin-inline-start:.15em}#send{display:flex;align-items:center;justify-content:center;gap:.25em}</style><style>#consent{accent-color:#D5BFFF;width:17px;height:17px;vertical-align:middle;cursor:pointer}#consent:focus-visible{outline:2px solid #D5BFFF;outline-offset:3px}</style><style>main>header{margin:0}main>header small{display:block;line-height:1.5}main h1.signature{margin:20px 0 8px}main>h1.signature+p{margin:0 0 24px;line-height:1.8}#form>label:first-child{display:block;margin:0 0 4px}</style></head><body><main><header><img src="../nan-logo.png.png" alt="NAN STUDIO" style="width:150px;height:auto;display:block;margin:0 auto 12px"><small>THE SUNSHINE EXPERIENCE</small></header><h1 class="signature"><span class="signature-text">لكل تجربة شمسها</span><span class="signature-sun" aria-hidden="true">☀︎</span></h1><p>ودنا نعرف كيف كانت شمس تجربتك معنا</p><form id="form"><label for="service">وش الخدمة اللي جربتها؟</label><select id="service" required><option value="">اختاري الخدمة</option><option>صفحات الهبوط</option><option>المواقع الإلكترونية</option><option>المنيو التفاعلي</option><option>تصاميم الأيام العالمية</option><option>ملف أعمال رقمي</option><option>بوستات السوشيال ميديا</option><option>تصوير المنتجات بالذكاء الاصطناعي</option><option>كتابة السيناريوهات والمحتوى</option><option>خدمة أخرى</option></select><div class="stars" id="stars"></div><p id="rating" aria-live="polite">كم شمس تستحق تجربتنا؟</p><textarea rows="4" maxlength="4000" placeholder="اكتب لنا ما لا تقوله الشموس..." aria-label="التقييم الكتابي"></textarea><label style="display:block;font-size:13px;text-align:right"><input type="checkbox" id="consent"> أوافق على نشر تعليقي وتقييمي للعامة</label><button class="send" id="send" disabled>أرسل لنا شمسك <span class="send-sun" aria-hidden="true">☀︎</span></button><p id="feedbackStatus" role="status"></p></form><section id="thanks" hidden><h2>وصلنا نورك! ☀︎</h2><p>شكرًا لأنك تساهم في حكاية نان</p><button class="send" onclick="location.reload()">إعادة التجربة</button></section><section class="wall" hidden id="sunshineWall"><small>SUNSHINE WALL</small><div class="wall-track" id="wallTrack" tabindex="0" aria-label="آراء العملاء"></div><button class="wall-toggle" id="wallToggle" type="button" aria-label="إيقاف الحركة">Ⅱ</button><p>كل شمس منكم تصنع فرقًا</p></section></main><script>let rating=0;const stars=document.getElementById("stars"),send=document.getElementById("send");for(let n=1;n<=5;n++){const b=document.createElement("button");b.type="button";b.textContent="☀︎";b.setAttribute("aria-label",n+" من 5 شموس");b.setAttribute("aria-pressed","false");b.onclick=()=>{rating=n;[...stars.children].forEach((x,i)=>{x.classList.toggle("active",i<n);x.setAttribute("aria-pressed",String(i+1===n))});document.getElementById("rating").textContent=["","نقدر نكون أفضل","ما وصلنا لتوقعاتك","تجربة جيدة","تجربة جميلة","خمس شموس من الإبداع!"][n];send.disabled=false};stars.append(b)}document.getElementById("form").onsubmit=async e=>{e.preventDefault();if(!rating)return;send.disabled=true;const status=document.getElementById("feedbackStatus");status.textContent="جاري الإرسال...";try{const r=await fetch("https://zyxgqkojiwmlzddtucpa.supabase.co/functions/v1/sunshine-submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({service:document.getElementById("service").value,rating,note:document.querySelector("textarea").value,consent:document.getElementById("consent").checked})});if(!r.ok||!(await r.json()).ok)throw Error(r.status===429?"انتظري قليلًا قبل إرسال تقييم آخر":"تعذر حفظ التقييم، حاولي مرة أخرى");e.target.hidden=true;document.getElementById("thanks").hidden=false;loadWall()}catch(err){status.textContent=err.message;send.disabled=false}};</script><script>(()=>{const track=document.getElementById('wallTrack'),toggle=document.getElementById('wallToggle');let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,hover=false;const label=()=>{toggle.textContent=paused?'▷':'Ⅱ';toggle.setAttribute('aria-label',paused?'تشغيل الحركة':'إيقاف الحركة')};label();toggle.onclick=()=>{paused=!paused;label()};track.addEventListener('pointerenter',()=>hover=true);track.addEventListener('pointerleave',()=>hover=false);setInterval(()=>{if(paused||hover||track.contains(document.activeElement)||document.hidden)return;const max=track.scrollWidth-track.clientWidth;if(max<=0)return;const next=Math.abs(track.scrollLeft)>=max-5?0:Math.min(max,Math.abs(track.scrollLeft)+259);track.scrollTo({left:-next,behavior:'smooth'})},4200)})();</script><script>async function loadWall(){try{const r=await fetch("https://zyxgqkojiwmlzddtucpa.supabase.co/rest/v1/sunshine_feedback?select=service,rating,note&consent=eq.true&hidden=eq.false&order=created_at.desc&limit=50",{headers:{apikey:"sb_publishable_uLPRFjMh0W-094oFXpmYlQ_JHIiE9M8"},cache:"no-store"});if(!r.ok)return;const rows=await r.json(),track=document.getElementById("wallTrack");track.replaceChildren();for(const row of rows){const card=document.createElement("article");card.className="wall-card";for(const [tag,value] of [["span","☀︎ ".repeat(row.rating)],["h3",row.service],["p",row.note]]){const el=document.createElement(tag);el.textContent=value;card.append(el)}track.append(card)}document.getElementById("sunshineWall").hidden=!rows.length}catch{}}loadWall();</script></body></html>
