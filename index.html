<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NAN CLIENT SPACE</title><style>*{box-sizing:border-box}body{margin:0;background:#151515;color:#f5f1ff;font-family:system-ui;min-height:100dvh;display:grid;place-items:center}main{width:min(440px,92vw);padding:32px}header,footer{text-align:center;color:#d5bfff}header{font-size:28px;letter-spacing:3px}small{display:block;font-size:11px;letter-spacing:2px;margin:12px}h1{font-size:30px;font-weight:500}p{color:#beb6ca;line-height:1.8}input,button{font:inherit;width:100%;padding:15px;border-radius:12px;margin:8px 0}input{background:#222;color:white;border:1px solid #51485e}button{background:#d5bfff;color:#151515;border:0;cursor:pointer}button.secondary{background:transparent;color:inherit;border:1px solid #51485e}footer{margin-top:45px}body.client{background:#51553a;color:#f5f3e9}body.client input{background:#45492f}body.client button{background:#f5f3e9}body.client button.secondary{background:transparent;color:white} [hidden]{display:none!important}body.admin-wide{display:block}body.admin-wide main{width:min(1280px,96vw);margin:auto;padding:clamp(16px,3vw,40px)}body.admin-wide #addclient{max-width:520px}.week-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}.week-stats div,.script-card{background:#202024;border:1px solid #40394a;border-radius:16px;padding:16px;overflow-wrap:anywhere}.week-stats strong{display:block;font-size:28px;color:#d5bfff}.week-stats span{font-size:13px;color:#beb6ca}.script-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:12px;margin:18px 0}.script-card small{margin:0;color:#aaa0b7;letter-spacing:0}.script-card h3{font-size:18px;line-height:1.6}.review-state{display:inline-block;padding:6px 12px;border-radius:20px;font-size:13px;background:#36343b;color:#ddd}.review-state.approved{background:#203d30;color:#a9e8bd}.review-state.revision{background:#49321f;color:#ffd19b}.review-note{background:#2d2535;padding:12px;border-radius:10px;white-space:pre-wrap}.script-card details{margin-top:16px;color:#beb6ca}.script-card summary{cursor:pointer}progress{width:100%;accent-color:#d5bfff;height:12px}button:disabled{opacity:.45;cursor:not-allowed}@media(max-width:480px){.week-stats div{padding:10px}.week-stats span{font-size:11px}}</style></head><body><main><header id="brand"><img src="./nan-logo.png.png" alt="NAN STUDIO" style="display:block;width:155px;max-height:100px;object-fit:contain;margin:0 auto 14px"><small>CONTROL CENTER — 01</small></header><section id="admin"><h1>مساحتك لإدارة الإبداع</h1><p>جميع عملائك ومشاريعك، في مكان واحد</p><form id="emailform"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" required dir="ltr"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required dir="ltr"><button>تسجيل الدخول</button></form></section><section id="recovery" hidden><h1>تعيين كلمة المرور</h1><form id="recoveryform"><label for="newpass">كلمة المرور الجديدة</label><input id="newpass" type="password" autocomplete="new-password" minlength="12" required><label for="confirmpass">تأكيد كلمة المرور</label><input id="confirmpass" type="password" autocomplete="new-password" minlength="12" required><button>حفظ كلمة المرور</button></form></section><section id="client" hidden><h1>أهلًا في مساحتكم الخاصة</h1><p>أدخلي رمز الدخول المخصص لكِ</p><form id="pinform"><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required aria-label="رمز الدخول"><button>دخول إلى مساحتي</button></form></section><section id="dashboard" hidden><h1>مساحة الإدارة</h1><p>عملاء NAN STUDIO</p><form id="addclient"><label>اسم العميل</label><input id="newname" required maxlength="100" placeholder="اسم العلامة التجارية"><label>معرّف الرابط بالإنجليزية</label><input id="newslug" required pattern="[a-z0-9][a-z0-9-]{0,63}" maxlength="64" dir="ltr" placeholder="brand-name"><button>إضافة عميل جديد</button><p id="addstatus" role="status"></p></form><div id="clients"></div><section id="sunroom"><h2 style="color:#d5bfff">SUNSHINE ROOM ☀︎</h2><button id="refreshSun" class="secondary">تحديث التقييمات</button><div id="sunStats"></div><div id="sunServices"></div><div id="sunReviews"></div><p id="sunStatus" role="status"></p></section><button id="logout" class="secondary">تسجيل الخروج</button></section><p id="status" role="status"></p><button id="switch" class="secondary">دخول العملاء</button><footer>NAN STUDIO<p>المألوف لا يشبهنا</p></footer></main><script>const base="https://zyxgqkojiwmlzddtucpa.supabase.co",key="sb_publishable_uLPRFjMh0W-094oFXpmYlQ_JHIiE9M8",redirect="https://buildnan.github.io/nan-client-space/";const $=id=>document.getElementById(id);let client=false;function mode(v){client=v;document.body.classList.toggle("client",v);$("admin").hidden=v;$("client").hidden=!v;$("brand").textContent=v?"EVARA":"NAN STUDIO";$("switch").textContent=v?"دخول الإدارة":"دخول العملاء";$("status").textContent=""} $("switch").onclick=()=>mode(!client);if(new URLSearchParams(location.search).get("client")==="evara")mode(true);$("emailform").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;$("status").textContent="جاري التحقق…";try{const r=await fetch(base+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:key,"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value.trim(),password:$("password").value})});if(!r.ok){$("status").textContent=r.status===429?"محاولات كثيرة، حاولي لاحقًا":"تعذر الدخول، تحققي من البريد وكلمة المرور";return}const data=await r.json();await dashboard(data.access_token)}catch{$("status").textContent="تعذر الاتصال أو التحقق من صلاحية الإدارة"}finally{$("password").value="";b.disabled=false}};$("pinform").onsubmit=async e=>{e.preventDefault();$("status").textContent="جاري التحقق…";try{const r=await fetch(base+"/functions/v1/client-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({slug:"evara",pin:$("pin").value})});$("pin").value="";$("status").textContent=r.ok?"تم التحقق. مساحة المحتوى قيد التجهيز":"تعذر الدخول. تحققي من الرمز أو حاولي لاحقًا"}catch{$("status").textContent="تعذر الاتصال"}};async function dashboard(token){const headers={apikey:key,Authorization:"Bearer "+token};const r=await fetch(base+"/rest/v1/memberships?select=role",{headers});if(!r.ok)throw Error();const rows=await r.json();if(!rows.some(x=>x.role==="admin"))throw Error();const c=await fetch(base+"/rest/v1/clients?select=id,slug,name&order=name",{headers});if(!c.ok)throw Error();const clients=await c.json();$("admin").hidden=true;$("client").hidden=true;$("switch").hidden=true;$("dashboard").hidden=false;document.body.classList.add("admin-wide");$("status").textContent="";$("clients").replaceChildren();for(const item of clients){const card=document.createElement("div");card.style.cssText="border:1px solid #51485e;border-radius:16px;padding:18px;margin:12px 0";const title=document.createElement("strong");title.textContent=item.name;card.append(title);const link=document.createElement("button");link.textContent="نسخ رابط العميل";link.onclick=async()=>{try{await navigator.clipboard.writeText(redirect+"client/?id="+encodeURIComponent(item.slug));$("status").textContent="تم نسخ الرابط"}catch{$("status").textContent=redirect+"client/?id="+encodeURIComponent(item.slug)}};card.append(link);const pinForm=document.createElement("form");const label=document.createElement("label");label.textContent="إنشاء أو تغيير رمز الدخول";const field=document.createElement("input");field.type="password";field.inputMode="numeric";field.pattern="[0-9]{6}";field.maxLength=6;field.required=true;field.autocomplete="off";field.placeholder="٦ أرقام";field.setAttribute("aria-label","رمز الدخول الجديد");const save=document.createElement("button");save.textContent="حفظ الرمز الجديد";const msg=document.createElement("p");msg.setAttribute("role","status");pinForm.append(label,field,save,msg);pinForm.onsubmit=async e=>{e.preventDefault();if(!confirm("حفظ رمز جديد يلغي جلسات العميل السابقة. متابعة؟"))return;save.disabled=true;msg.textContent="جاري الحفظ…";try{const response=await fetch(base+"/rest/v1/rpc/admin_set_client_pin",{method:"POST",headers:{...headers,"Content-Type":"application/json"},body:JSON.stringify({p_client:item.id,p_pin:field.value})});msg.textContent=response.ok?"تم حفظ الرمز وإلغاء الجلسات السابقة":"تعذر حفظ الرمز. تأكدي من صلاحية الجلسة"}catch{msg.textContent="تعذر الاتصال"}finally{field.value="";save.disabled=false}};card.append(pinForm);const manage=document.createElement("button");manage.className="secondary";manage.textContent="إدارة نشر السيناريوهات";const panel=document.createElement("div");panel.hidden=true;manage.onclick=()=>{panel.hidden=!panel.hidden;if(!panel.hidden)loadPublishing(item.id,panel,headers)};card.append(manage,panel);$("clients").append(card)}sessionStorage.setItem("nan_admin_access",token);$("refreshSun").onclick=()=>loadSunshine(token);loadSunshine(token);$("addclient").onsubmit=async e=>{e.preventDefault();const name=$("newname").value.trim(),slug=$("newslug").value.trim();if(!name||!/^[a-z0-9][a-z0-9-]{0,63}$/.test(slug))return;const b=e.target.querySelector("button");b.disabled=true;try{const r=await fetch(base+"/rest/v1/clients",{method:"POST",headers:{...headers,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({name,slug})});if(!r.ok){$("addstatus").textContent=r.status===409?"معرّف الرابط مستخدم بالفعل":"تعذر إضافة العميل";return}$("addclient").reset();$("addstatus").textContent="تم إنشاء العميل";await dashboard(token)}catch{$("addstatus").textContent="تعذر تحديث القائمة. أعيدي تحميل الصفحة للتحقق"}finally{b.disabled=false}}}$("logout").onclick=async()=>{const t=sessionStorage.getItem("nan_admin_access");sessionStorage.removeItem("nan_admin_access");if(t)try{await fetch(base+"/auth/v1/logout",{method:"POST",headers:{apikey:key,Authorization:"Bearer "+t}})}catch{}location.replace(redirect)};if(!location.hash&&sessionStorage.getItem("nan_admin_access"))dashboard(sessionStorage.getItem("nan_admin_access")).catch(()=>{sessionStorage.removeItem("nan_admin_access");$("status").textContent="انتهت الجلسة، سجلي الدخول مجددًا"});if(location.hash){const p=new URLSearchParams(location.hash.slice(1));const token=p.get("access_token");history.replaceState(null,"",location.pathname+location.search);if(token&&p.get("type")==="recovery"){sessionStorage.removeItem("nan_admin_access");$("admin").hidden=true;$("client").hidden=true;$("switch").hidden=true;$("recovery").hidden=false;$("recoveryform").onsubmit=async e=>{e.preventDefault();const a=$("newpass"),b=$("confirmpass"),btn=e.target.querySelector("button");if(a.value!==b.value){$("status").textContent="كلمتا المرور غير متطابقتين";return}btn.disabled=true;try{const headers={apikey:key,Authorization:"Bearer "+token,"Content-Type":"application/json"};const check=await fetch(base+"/rest/v1/memberships?select=role",{headers});if(!check.ok||!(await check.json()).some(x=>x.role==="admin"))throw Error();const r=await fetch(base+"/auth/v1/user",{method:"PUT",headers,body:JSON.stringify({password:a.value})});if(!r.ok){$("status").textContent="تعذر الحفظ. تحققي من قوة كلمة المرور وصلاحية الرابط";return}$("recovery").hidden=true;$("admin").hidden=false;$("switch").hidden=false;$("status").textContent="تم حفظ كلمة المرور. سجلي الدخول الآن";try{await fetch(base+"/auth/v1/logout",{method:"POST",headers})}catch{}}catch{$("status").textContent="تعذر التحقق من صلاحية الرابط"}finally{a.value="";b.value="";btn.disabled=false}}}else if(token){dashboard(token).catch(()=>{$("status").textContent="تعذر التحقق من صلاحية الإدارة"})}}</script><script>async function loadSunshine(token){const headers={apikey:key,Authorization:"Bearer "+token};const endpoint=base+"/rest/v1/sunshine_feedback";loadPrivateFeedback(headers);const msg=$("sunStatus");msg.textContent="جاري التحميل…";try{let rows=[],offset=0;while(true){const r=await fetch(endpoint+"?select=id,service,rating,note,consent,hidden,created_at&order=created_at.desc,id.desc&limit=500&offset="+offset,{headers,cache:"no-store"});if(!r.ok)throw Error();const page=await r.json();rows.push(...page);if(page.length<500)break;offset+=page.length}const stats=$("sunStats");stats.textContent=rows.length+" تقييم | متوسط الشموس: "+(rows.length?(rows.reduce((a,x)=>a+x.rating,0)/rows.length).toFixed(1)+" / 5":"—");const groups={};for(const x of rows){groups[x.service]??=[];groups[x.service].push(x.rating)}$("sunServices").replaceChildren();for(const [name,ratings] of Object.entries(groups)){const p=document.createElement("p");p.textContent=name+" — "+ratings.length+" تقييم، "+(ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1)+" ☀︎";$("sunServices").append(p)}const list=$("sunReviews");list.replaceChildren();for(const x of rows){const card=document.createElement("article");card.style.cssText="border:1px solid #51485e;border-radius:16px;padding:16px;margin:12px 0;overflow-wrap:anywhere";for(const [tag,value] of [["strong",x.service],["p","☀︎ ".repeat(x.rating)],["p",x.note||"بدون تعليق"],["small",new Date(x.created_at).toLocaleString("ar-SA")+" | "+(!x.consent?"خاص":x.hidden?"مخفي":x.note.trim()?"منشور":"بدون تعليق للنشر")]]){const el=document.createElement(tag);el.textContent=value;card.append(el)}const action=async(method,body)=>{try{const r=await fetch(endpoint+"?id=eq."+encodeURIComponent(x.id),{method,headers:{...headers,"Content-Type":"application/json",Prefer:"return=representation"},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok||!(await r.json()).length)throw Error();await loadSunshine(token)}catch{msg.textContent="تعذر تنفيذ العملية. تحققي من الجلسة"}};if(x.consent){const b=document.createElement("button");b.className="secondary";b.textContent=x.hidden?"إعادة الإظهار":"إخفاء";b.onclick=()=>action("PATCH",{hidden:!x.hidden});card.append(b)}const del=document.createElement("button");del.className="secondary";del.textContent="حذف التقييم";del.onclick=()=>{if(confirm("حذف التقييم نهائيًا؟"))action("DELETE")};card.append(del);list.append(card)}msg.textContent=rows.length?"":"ما وصلتنا شموس إلى الآن ☀︎"}catch{msg.textContent="تعذر تحميل التقييمات. سجلي الدخول مجددًا عند انتهاء الجلسة"}}</script><script>async function loadPublishing(id,panel,headers){panel.textContent="جاري التحميل…";const endpoint=base+"/rest/v1/scripts";try{const r=await fetch(endpoint+"?client_id=eq."+encodeURIComponent(id)+"&select=id,week,number,title,content,released,pin_reviews(status,note,created_at)&order=number",{headers,cache:"no-store"});if(!r.ok)throw Error();const rows=await r.json();panel.replaceChildren();const refresh=document.createElement("button");refresh.className="secondary";refresh.textContent="تحديث الاعتمادات والملاحظات";refresh.onclick=()=>loadPublishing(id,panel,headers);panel.append(refresh);const make=(tag,t)=>{const e=document.createElement(tag);e.textContent=t;return e};function editor(x){const d=make("details","");d.append(make("summary",x.id?"تعديل السيناريو":"إضافة سيناريو جديد"));const fields={};for(const [key,label,value] of [["title","العنوان",x.title],["week","الأسبوع",x.week],["number","رقم السيناريو",x.number],["duration","المدة",x.content?.duration],["cast","الشخصيات",x.content?.cast],["props","الأدوات",x.content?.props],["scenes","المشاهد بالتفصيل — افصلي كل مشهد بسطر فارغ",(x.content?.scenes||[]).join("\n\n")],["ending","النهاية",x.content?.ending],["caption","الكابشن",x.content?.caption]]){const l=make("label",label),t=make("textarea","");t.value=value??"";t.rows=key==="scenes"?12:key==="caption"?4:1;t.style.cssText="width:100%;box-sizing:border-box;padding:10px;margin:6px 0 12px;border-radius:8px;background:#242128;color:#fff;border:1px solid #51485e;font:inherit";l.append(t);d.append(l);fields[key]=t}const b=make("button","حفظ السيناريو"),msg=make("p","");b.onclick=async()=>{const v=k=>fields[k].value.trim(),week=Number(v("week")),number=Number(v("number"));if(!v("title")||!v("scenes")||!Number.isInteger(week)||week<1||week>4||!Number.isInteger(number)||number<1||number>30){msg.textContent="تحققي من العنوان والمشاهد ورقم الأسبوع والسيناريو";return}if(x.released&&!confirm("السيناريو منشور، سيظهر التعديل للعميلة مباشرة. متابعة؟"))return;b.disabled=true;try{const content={...x.content,duration:v("duration"),cast:v("cast"),props:v("props"),scenes:v("scenes").split(/\n\s*\n/),ending:v("ending"),caption:v("caption")};const body={title:v("title"),week,number,content,...(!x.id?{client_id:id,released:false}:{})};const r=await fetch(endpoint+(x.id?"?id=eq."+encodeURIComponent(x.id)+"&client_id=eq."+encodeURIComponent(id):""),{method:x.id?"PATCH":"POST",headers:{...headers,"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify(body)});if(!r.ok||!(await r.json()).length)throw Error();await loadPublishing(id,panel,headers)}catch{msg.textContent="تعذر الحفظ، تحققي من الجلسة وعدم تكرار رقم السيناريو";b.disabled=false}};d.append(b,msg);return d}panel.append(editor({week:1,number:rows.length+1}));if(!rows.length){panel.append(make("p","لا توجد سيناريوهات محفوظة"));return}for(const week of [...new Set(rows.map(x=>x.week))]){const group=rows.filter(x=>x.week===week),box=make("section","");box.style.cssText="border-top:1px solid #51485e;padding:12px 0";box.append(make("h3","الأسبوع "+week),make("p",group.filter(x=>x.released).length+" / "+group.length+" منشور"));const latestOf=x=>(x.pin_reviews||[]).slice().sort((a,b)=>b.created_at.localeCompare(a.created_at))[0];const approved=group.filter(x=>latestOf(x)?.status==="approved").length,revision=group.filter(x=>latestOf(x)?.status==="revision").length;const stats=make("div","");stats.className="week-stats";for(const [label,count] of [["معتمد",approved],["طلب تعديل",revision],["بانتظار الاعتماد",group.length-approved-revision]]){const tile=make("div","");tile.append(make("strong",String(count)),make("span",label));stats.append(tile)}box.append(stats);const progress=make("progress","");progress.max=group.length;progress.value=approved;progress.setAttribute("aria-label","نسبة الاعتماد");box.append(progress,make("p",Math.round(approved/group.length*100)+"% نسبة الاعتماد"));const grid=make("div","");grid.className="script-grid";for(const x of group){const history=(x.pin_reviews||[]).slice().sort((a,b)=>b.created_at.localeCompare(a.created_at));const latest=history[0],card=make("article","");card.className="script-card";const state=make("span",latest?.status==="approved"?"معتمد":latest?.status==="revision"?"طلب تعديل":"بانتظار الاعتماد");state.className="review-state "+(latest?.status||"pending");card.append(make("small","SCENARIO "+String(x.number).padStart(2,"0")+" | "+(x.released?"منشور":"مسودة")),make("h3",x.title),state);if(latest?.note){const note=make("p",latest.note);note.className="review-note";card.append(make("h4","ملاحظة العميلة"),note)}if(history.length){const details=make("details","");details.append(make("summary","سجل المراجعات ("+history.length+")"));for(const review of history){details.append(make("p",new Date(review.created_at).toLocaleString("ar-SA")+" — "+(review.status==="approved"?"اعتماد":"طلب تعديل: "+review.note)))}card.append(details)}card.append(editor(x));grid.append(card)}box.append(grid);for(const release of [true,false]){const b=make("button",release?"نشر الأسبوع":"سحب نشر الأسبوع");b.className=release?"":"secondary";b.disabled=group.every(x=>x.released===release);b.onclick=async()=>{if(!confirm((release?"نشر":"سحب نشر")+" الأسبوع "+week+"؟"))return;for(const btn of box.querySelectorAll("button"))btn.disabled=true;try{const response=await fetch(endpoint+"?client_id=eq."+encodeURIComponent(id)+"&week=eq."+week,{method:"PATCH",headers:{...headers,"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify({released:release})});if(!response.ok||!(await response.json()).length)throw Error();await loadPublishing(id,panel,headers)}catch{box.append(make("p","تعذر تحديث النشر. أعيدي فتح القسم للتحقق"));for(const btn of box.querySelectorAll("button"))btn.disabled=false}};box.append(b)}panel.append(box)}}catch{panel.textContent="تعذر تحميل السيناريوهات. تحققي من صلاحية الجلسة"}}</script><script>async function loadPrivateFeedback(headers){let host=$("privateFeedback");if(!host){host=document.createElement("section");host.id="privateFeedback";$("sunReviews").after(host)}host.replaceChildren();const add=(tag,t,parent=host)=>{const e=document.createElement(tag);e.textContent=t;parent.append(e);return e};add("h2","تقييمات العملاء الخاصة");try{const r=await fetch(base+"/rest/v1/client_feedback?select=period,rating,note,created_at,clients(name)&order=created_at.desc",{headers,cache:"no-store"});if(!r.ok)throw Error();const rows=await r.json();if(!rows.length)add("p","لا توجد تقييمات خاصة حتى الآن");for(const x of rows){const card=add("article","");card.style.cssText="border:1px solid #51485e;border-radius:16px;padding:16px;margin:12px 0;overflow-wrap:anywhere";add("strong",(x.clients?.name||"عميل")+" | "+(x.period?"الأسبوع "+x.period:"تقييم الشهر"),card);add("p","☀︎ ".repeat(x.rating),card);add("p",x.note||"بدون تعليق",card);add("small",new Date(x.created_at).toLocaleString("ar-SA")+" | خاص",card)}}catch{add("p","تعذر تحميل التقييمات الخاصة")}}</script></body></html>
