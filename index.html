<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NAN CLIENT SPACE</title><style>*{box-sizing:border-box}body{margin:0;background:#151515;color:#f5f1ff;font-family:system-ui;min-height:100dvh;display:grid;place-items:center}main{width:min(440px,92vw);padding:32px}header,footer{text-align:center;color:#d5bfff}header{font-size:28px;letter-spacing:3px}small{display:block;font-size:11px;letter-spacing:2px;margin:12px}h1{font-size:30px;font-weight:500}p{color:#beb6ca;line-height:1.8}input,button{font:inherit;width:100%;padding:15px;border-radius:12px;margin:8px 0}input{background:#222;color:white;border:1px solid #51485e}button{background:#d5bfff;color:#151515;border:0;cursor:pointer}button.secondary{background:transparent;color:inherit;border:1px solid #51485e}footer{margin-top:45px}body.client{background:#51553a;color:#f5f3e9}body.client input{background:#45492f}body.client button{background:#f5f3e9}body.client button.secondary{background:transparent;color:white} [hidden]{display:none!important}</style></head><body><main><header id="brand">NAN STUDIO<small>CONTROL CENTER — 01</small></header><section id="admin"><h1>مساحتك لإدارة الإبداع.</h1><p>جميع عملائك ومشاريعك، في مكان واحد.</p><form id="emailform"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" required dir="ltr"><button>إرسال رابط الدخول</button></form></section><section id="client" hidden><h1>أهلًا في مساحتكم الخاصة</h1><p>أدخلي رمز الدخول المخصص لكِ.</p><form id="pinform"><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required aria-label="رمز الدخول"><button>دخول إلى مساحتي</button></form></section><section id="dashboard" hidden><h1>مساحة الإدارة</h1><p>عملاء NAN STUDIO</p><form id="addclient"><label>اسم العميل</label><input id="newname" required maxlength="100" placeholder="اسم العلامة التجارية"><label>معرّف الرابط بالإنجليزية</label><input id="newslug" required pattern="[a-z0-9][a-z0-9-]{0,63}" maxlength="64" dir="ltr" placeholder="brand-name"><button>إضافة عميل جديد</button><p id="addstatus" role="status"></p></form><div id="clients"></div><section id="sunroom"><h2 style="color:#d5bfff">SUNSHINE ROOM ☀︎</h2><button id="refreshSun" class="secondary">تحديث التقييمات</button><div id="sunStats"></div><div id="sunServices"></div><div id="sunReviews"></div><p id="sunStatus" role="status"></p></section><button id="logout" class="secondary">تسجيل الخروج</button></section><p id="status" role="status"></p><button id="switch" class="secondary">دخول العملاء</button><footer>NAN STUDIO<p>المألوف لا يشبهنا</p></footer></main><script>const base="https://zyxgqkojiwmlzddtucpa.supabase.co",key="sb_publishable_uLPRFjMh0W-094oFXpmYlQ_JHIiE9M8",redirect="https://buildnan.github.io/nan-client-space/";const $=id=>document.getElementById(id);let client=false;function mode(v){client=v;document.body.classList.toggle("client",v);$("admin").hidden=v;$("client").hidden=!v;$("brand").textContent=v?"EVARA":"NAN STUDIO";$("switch").textContent=v?"دخول الإدارة":"دخول العملاء";$("status").textContent=""} $("switch").onclick=()=>mode(!client);if(new URLSearchParams(location.search).get("client")==="evara")mode(true);$("emailform").onsubmit=async e=>{e.preventDefault();$("status").textContent="جاري الإرسال…";try{const r=await fetch(base+"/auth/v1/otp?redirect_to="+encodeURIComponent(redirect),{method:"POST",headers:{apikey:key,"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,create_user:false})});$("status").textContent=r.ok?"إذا كان الحساب مسجلاً، راجعي بريدك.":"تعذر الإرسال، حاولي لاحقًا."}catch{$("status").textContent="تعذر الاتصال."}};$("pinform").onsubmit=async e=>{e.preventDefault();$("status").textContent="جاري التحقق…";try{const r=await fetch(base+"/functions/v1/client-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({slug:"evara",pin:$("pin").value})});$("pin").value="";$("status").textContent=r.ok?"تم التحقق. مساحة المحتوى قيد التجهيز.":"تعذر الدخول. تحققي من الرمز أو حاولي لاحقًا."}catch{$("status").textContent="تعذر الاتصال."}};async function dashboard(token){const headers={apikey:key,Authorization:"Bearer "+token};const r=await fetch(base+"/rest/v1/memberships?select=role",{headers});if(!r.ok)throw Error();const rows=await r.json();if(!rows.some(x=>x.role==="admin"))throw Error();const c=await fetch(base+"/rest/v1/clients?select=id,slug,name&order=name",{headers});if(!c.ok)throw Error();const clients=await c.json();$("admin").hidden=true;$("client").hidden=true;$("switch").hidden=true;$("dashboard").hidden=false;$("status").textContent="";$("clients").replaceChildren();for(const item of clients){const card=document.createElement("div");card.style.cssText="border:1px solid #51485e;border-radius:16px;padding:18px;margin:12px 0";const title=document.createElement("strong");title.textContent=item.name;card.append(title);const link=document.createElement("button");link.textContent="نسخ رابط العميل";link.onclick=async()=>{try{await navigator.clipboard.writeText(redirect+"client/?id="+encodeURIComponent(item.slug));$("status").textContent="تم نسخ الرابط"}catch{$("status").textContent=redirect+"client/?id="+encodeURIComponent(item.slug)}};card.append(link);const pinForm=document.createElement("form");const label=document.createElement("label");label.textContent="إنشاء أو تغيير رمز الدخول";const field=document.createElement("input");field.type="password";field.inputMode="numeric";field.pattern="[0-9]{6}";field.maxLength=6;field.required=true;field.autocomplete="off";field.placeholder="٦ أرقام";field.setAttribute("aria-label","رمز الدخول الجديد");const save=document.createElement("button");save.textContent="حفظ الرمز الجديد";const msg=document.createElement("p");msg.setAttribute("role","status");pinForm.append(label,field,save,msg);pinForm.onsubmit=async e=>{e.preventDefault();if(!confirm("حفظ رمز جديد يلغي جلسات العميل السابقة. متابعة؟"))return;save.disabled=true;msg.textContent="جاري الحفظ…";try{const response=await fetch(base+"/rest/v1/rpc/admin_set_client_pin",{method:"POST",headers:{...headers,"Content-Type":"application/json"},body:JSON.stringify({p_client:item.id,p_pin:field.value})});msg.textContent=response.ok?"تم حفظ الرمز وإلغاء الجلسات السابقة.":"تعذر حفظ الرمز. تأكدي من صلاحية الجلسة."}catch{msg.textContent="تعذر الاتصال."}finally{field.value="";save.disabled=false}};card.append(pinForm);$("clients").append(card)}sessionStorage.setItem("nan_admin_access",token);$("refreshSun").onclick=()=>loadSunshine(token);loadSunshine(token);$("addclient").onsubmit=async e=>{e.preventDefault();const name=$("newname").value.trim(),slug=$("newslug").value.trim();if(!name||!/^[a-z0-9][a-z0-9-]{0,63}$/.test(slug))return;const b=e.target.querySelector("button");b.disabled=true;try{const r=await fetch(base+"/rest/v1/clients",{method:"POST",headers:{...headers,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({name,slug})});if(!r.ok){$("addstatus").textContent=r.status===409?"معرّف الرابط مستخدم بالفعل.":"تعذر إضافة العميل.";return}$("addclient").reset();$("addstatus").textContent="تم إنشاء العميل.";await dashboard(token)}catch{$("addstatus").textContent="تعذر تحديث القائمة. أعيدي تحميل الصفحة للتحقق."}finally{b.disabled=false}}}$("logout").onclick=async()=>{const t=sessionStorage.getItem("nan_admin_access");sessionStorage.removeItem("nan_admin_access");if(t)try{await fetch(base+"/auth/v1/logout",{method:"POST",headers:{apikey:key,Authorization:"Bearer "+t}})}catch{}location.replace(redirect)};if(!location.hash&&sessionStorage.getItem("nan_admin_access"))dashboard(sessionStorage.getItem("nan_admin_access")).catch(()=>{sessionStorage.removeItem("nan_admin_access");$("status").textContent="انتهت الجلسة، سجلي الدخول مجددًا."});if(location.hash){const p=new URLSearchParams(location.hash.slice(1));const token=p.get("access_token");history.replaceState(null,"",location.pathname+location.search);if(token){dashboard(token).catch(()=>{$("status").textContent="تعذر التحقق من صلاحية الإدارة."})}}</script><script>async function loadSunshine(token){const headers={apikey:key,Authorization:"Bearer "+token};const endpoint=base+"/rest/v1/sunshine_feedback";const msg=$("sunStatus");msg.textContent="جاري التحميل…";try{let rows=[],offset=0;while(true){const r=await fetch(endpoint+"?select=id,service,rating,note,consent,hidden,created_at&order=created_at.desc,id.desc&limit=500&offset="+offset,{headers,cache:"no-store"});if(!r.ok)throw Error();const page=await r.json();rows.push(...page);if(page.length<500)break;offset+=page.length}const stats=$("sunStats");stats.textContent=rows.length+" تقييم | متوسط الشموس: "+(rows.length?(rows.reduce((a,x)=>a+x.rating,0)/rows.length).toFixed(1)+" / 5":"—");const groups={};for(const x of rows){groups[x.service]??=[];groups[x.service].push(x.rating)}$("sunServices").replaceChildren();for(const [name,ratings] of Object.entries(groups)){const p=document.createElement("p");p.textContent=name+" — "+ratings.length+" تقييم، "+(ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1)+" ☀︎";$("sunServices").append(p)}const list=$("sunReviews");list.replaceChildren();for(const x of rows){const card=document.createElement("article");card.style.cssText="border:1px solid #51485e;border-radius:16px;padding:16px;margin:12px 0;overflow-wrap:anywhere";for(const [tag,value] of [["strong",x.service],["p","☀︎ ".repeat(x.rating)],["p",x.note||"بدون تعليق"],["small",new Date(x.created_at).toLocaleString("ar-SA")+" | "+(!x.consent?"خاص":x.hidden?"مخفي":x.note.trim()?"منشور":"بدون تعليق للنشر")]]){const el=document.createElement(tag);el.textContent=value;card.append(el)}const action=async(method,body)=>{try{const r=await fetch(endpoint+"?id=eq."+encodeURIComponent(x.id),{method,headers:{...headers,"Content-Type":"application/json",Prefer:"return=representation"},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok||!(await r.json()).length)throw Error();await loadSunshine(token)}catch{msg.textContent="تعذر تنفيذ العملية. تحققي من الجلسة."}};if(x.consent){const b=document.createElement("button");b.className="secondary";b.textContent=x.hidden?"إعادة الإظهار":"إخفاء";b.onclick=()=>action("PATCH",{hidden:!x.hidden});card.append(b)}const del=document.createElement("button");del.className="secondary";del.textContent="حذف التقييم";del.onclick=()=>{if(confirm("حذف التقييم نهائيًا؟"))action("DELETE")};card.append(del);list.append(card)}msg.textContent=rows.length?"":"ما وصلتنا شموس إلى الآن ☀︎"}catch{msg.textContent="تعذر تحميل التقييمات. سجلي الدخول مجددًا عند انتهاء الجلسة."}}</script></body></html>
