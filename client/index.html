<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>مساحة العميل | NAN STUDIO</title><style>*{box-sizing:border-box}body{margin:0;background:#181818;color:#f5f1ff;min-height:100dvh;display:grid;place-items:center;font-family:system-ui}main{width:min(420px,90vw);padding:28px;text-align:center}input,button{width:100%;padding:16px;margin:8px 0;border-radius:12px;font:inherit}input{background:#262626;color:white;border:1px solid #777;text-align:center}button{background:#d5bfff;border:0;color:#181818}footer{margin-top:40px;color:#d5bfff}</style><main><h1 id="brand">مساحتكم الإبداعية</h1><p>أدخل رمز الدخول الخاص بمساحتك</p><form id="form"><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required aria-label="رمز الدخول"><button>دخول</button></form><p id="status" role="status"></p><footer>NAN STUDIO<br>المألوف لا يشبهنا</footer></main><script>const slug=new URLSearchParams(location.search).get("id")||"",form=document.getElementById("form"),pin=document.getElementById("pin"),status=document.getElementById("status");if(slug==="evara")location.replace("../evara/");if(!/^[a-z0-9][a-z0-9-]{0,63}$/.test(slug)){form.hidden=true;status.textContent="الرابط غير صالح"}form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector("button");b.disabled=true;try{const r=await fetch("https://zyxgqkojiwmlzddtucpa.supabase.co/functions/v1/client-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({slug,pin:pin.value})});status.textContent=r.ok?"تم التحقق. المحتوى قيد التجهيز.":"تعذر الدخول. تحقق من الرمز أو حاول لاحقًا."}catch{status.textContent="تعذر الاتصال."}finally{pin.value="";b.disabled=false}};</script></html>
