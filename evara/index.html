<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EVARA × NAN STUDIO</title><style>*{box-sizing:border-box}body{margin:0;background:#51553a;color:#f5f3e9;font-family:system-ui;min-height:100dvh;display:grid;place-items:center}main{width:min(420px,90vw);padding:30px;text-align:center}header{font:36px Georgia,serif;letter-spacing:7px}small{display:block;font:11px system-ui;letter-spacing:3px;margin:12px}h1{font:30px Georgia,serif;margin-top:45px}p{line-height:1.8}input,button{width:100%;padding:16px;border-radius:10px;font:inherit;margin:8px 0}input{background:#45492f;color:white;border:1px solid #aaa98e;text-align:center;letter-spacing:8px}button{background:#f5f3e9;color:#51553a;border:0;cursor:pointer}footer{margin-top:48px;font-size:12px;letter-spacing:2px}</style><style>[hidden]{display:none!important}main:has(#portal:not([hidden])){width:min(740px,96vw)}article{background:#f5f3e9;color:#45492f;border-radius:18px;padding:20px;margin:16px 0;text-align:right}article button{background:#51553a;color:#fff}textarea{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid #aaa98e}summary{cursor:pointer;font-weight:600}button:disabled{opacity:.5}article p{white-space:pre-wrap}</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@dawod/thmanyah-font-web/serif-display.css"><style>body{background:radial-gradient(ellipse at top,#666b4c,#51553a 65%);font-family:system-ui}main{padding:30px 18px}#portal h1{font-family:'Thmanyah Serif Display',Georgia,serif;font-weight:300;font-size:clamp(35px,8vw,60px);margin:24px 0 12px}#portal>p{max-width:480px;margin:12px auto 24px}article{box-shadow:0 8px 30px #25281926;border:1px solid #fff5;animation:appear .45s ease both}summary{padding:8px 0}details[open] summary{border-bottom:1px solid #c9c9b7;margin-bottom:14px}article button:last-child{background:transparent;color:#51553a;border:1px solid #51553a}#progress{border:1px solid #ffffff50;border-radius:40px;padding:12px}#scripts h2{font-weight:400;text-align:right;margin-top:35px}footer img{display:block;width:110px;height:auto;margin:18px auto}footer p{font-family:'Thmanyah Serif Display',serif;font-size:20px;letter-spacing:0}.spark{position:fixed;pointer-events:none;z-index:99;animation:spark .9s ease-out forwards;color:#f5e7b5;font-size:24px}@keyframes spark{to{transform:translate(var(--x),var(--y)) rotate(160deg);opacity:0}}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.spark{display:none}}</style><style>body:has(#portal:not([hidden])){display:block;background:#f5f3e9;color:#35392a;font-family:Tahoma,Arial,sans-serif}main:has(#portal:not([hidden])){width:100%;max-width:900px;margin:auto;padding:20px;text-align:right}main:has(#portal:not([hidden]))>header{display:none}.hero{background:#51553a;color:#fff;border-radius:24px;text-align:center;padding:25px;margin:20px 0;animation:appear .6s ease}.hero img{width:190px;max-width:70%;max-height:145px;object-fit:contain}.hero p{margin:5px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#e6e7db;border-radius:16px;padding:15px;text-align:center;font-size:12px}.stat b{display:block;font-size:30px}.track{height:6px;background:#dddcd0;border-radius:9px;margin:15px 0;overflow:hidden}.track div{background:#555b39;height:100%;transition:width .4s}#progress{text-align:center;border:0;padding:0}nav{display:flex;gap:7px;margin:20px 0}nav button{flex:1;font-size:12px;padding:10px 4px;background:#e4e5d9;color:#35392a}nav button.active{background:#51553a;color:white}article{background:white;border-radius:16px;margin:10px 0;padding:14px;box-shadow:none;border:0}summary{display:flex;align-items:center;gap:12px;list-style:none}.num{font-size:24px;color:#777e57}.grow{flex:1}.small{font-size:11px;color:#696e58}details[open] summary{padding-bottom:15px}main:has(#portal:not([hidden])) footer{background:#181818;color:#d5bfff;text-align:center;border-radius:18px;padding:24px;margin-top:24px}#logout{background:#e4e5d9}textarea{background:#faf9f4}.spark{color:#777e57}</style></head><body><main><header><img src="../evara-logo.png.PNG" alt="EVARA JEWELRY" style="display:block;width:160px;max-height:140px;object-fit:contain;margin:0 auto"></header><section id="login"><h1>مساحتكم الإبداعية</h1><p>أهلًا بإيفارا، أدخلي رمز الدخول الخاص بمساحتك</p><form id="form"><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required aria-label="رمز الدخول" autocomplete="off" placeholder="••••••" dir="ltr"><button id="submit">دخول إلى مساحتي</button></form><p id="status" role="status"></p></section><section id="portal" hidden><section class="hero"><img src="../evara-logo.png.PNG" alt="EVARA JEWELRY"><h1>شهر كامل خارج المألوف</h1><p>خطة محتوى إبداعية لشهر كامل، تضم 30 سيناريو صُممت خصيصًا لإيفارا</p><small>EVARA × NAN STUDIO</small></section><div id="stats" class="stats"></div><div class="track"><div id="bar"></div></div><p id="progress"></p><nav id="weeks" aria-label="الأسابيع"></nav><div id="scripts"></div><div id="feedback"></div><p id="notice" role="status"></p><button id="logout">تسجيل الخروج</button></section><div style="text-align:center;margin:28px auto 12px;font:600 12px system-ui;letter-spacing:3px;color:#51553a">NAN STUDIO</div></main><script>const $=id=>document.getElementById(id),base="https://zyxgqkojiwmlzddtucpa.supabase.co/functions/v1/";let token="",selectedWeek=1;async function api(body){const r=await fetch(base+"portal-api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body,token})});const j=await r.json();if(!r.ok||!j.ok)throw Error("تعذر تنفيذ الطلب. تحققي من الجلسة");return j.data}function el(tag,t){const x=document.createElement(tag);x.textContent=t;return x}async function load(){const rows=await api({action:"list"});$("login").hidden=true;$("portal").hidden=false;$("progress").textContent=rows.filter(x=>x.review?.status==="approved").length+" / 30 سيناريو معتمد";const approved=rows.filter(x=>x.review?.status==="approved").length,revision=rows.filter(x=>x.review?.status==="revision").length;$("stats").replaceChildren();for(const [n,label] of [[30,"إجمالي السيناريوهات"],[approved,"معتمد"],[revision,"يحتاج تعديل"]]){const tile=el("div","");tile.className="stat";tile.append(el("b",n),el("span",label));$("stats").append(tile)}$("bar").style.width=approved/30*100+"%";$("weeks").replaceChildren();for(let w=1;w<=4;w++){const b=el("button","الأسبوع "+w);b.className=w===selectedWeek?"active":"";b.setAttribute("aria-pressed",String(w===selectedWeek));b.onclick=()=>{selectedWeek=w;load().catch(e=>$("notice").textContent=e.message)};$("weeks").append(b)}$("scripts").replaceChildren();const complete=w=>{const g=rows.filter(x=>x.week===w);return g.length===[7,7,8,8][w-1]&&g.every(x=>x.review?.status==="approved")};if([1,2,3,4].every(complete))$("scripts").append(el("p","شهر من الإبداع معكم ✧ شكرًا لفريق إيفارا على ثقتكم"));if(!rows.some(x=>x.week===selectedWeek))$("scripts").append(el("p","لا توجد سيناريوهات منشورة حاليًا"));for(const w of [selectedWeek]){const g=rows.filter(x=>x.week===w);if(g.length===[7,7,8,8][w-1]&&g.every(x=>x.review?.status==="approved"))$("scripts").append(el("p","شكرًا إيفارا 🤍 اكتمل اعتماد الأسبوع "+w+"، ممتنين لثقتكم وإبداعكم معنا"))}let week=0;for(const x of rows.filter(x=>x.week===selectedWeek)){if(x.week!==week){week=x.week;$("scripts").append(el("h2","الأسبوع "+week))}const card=el("article",""),details=el("details","");const head=el("summary","");const num=el("span",String(x.number).padStart(2,"0"));num.className="num";const title=el("span",x.title);title.className="grow";const state=el("span",x.review?.status==="approved"?"✓ معتمد":x.review?.status==="revision"?"يحتاج تعديل":"بانتظار الاعتماد");state.className="small";head.append(num,title,state);details.append(head);const c=x.content;for(const [k,v] of [["المدة",c.duration],["الشخصيات",c.cast],["الأدوات",c.props]])details.append(el("p",k+": "+(v||"")));for(const scene of c.scenes||[])details.append(el("p",scene));details.append(el("p","النهاية: "+(c.ending||"")));if(c.caption)details.append(el("p","الكابشن: "+c.caption));const production=el("p","ملاحظة إنتاجية: يُترك اختيار الأصوات والمؤثرات الصوتية لممنتجة الفيديو بما يتناسب مع طبيعة المشاهد والهوية البصرية للعلامة التجارية، ولا يشمل نطاق خدمة كتابة السيناريو اختيار الموسيقى أو اعتمادها");production.style.cssText="background:#f5f3e9;padding:14px;border-radius:10px;font-size:13px;line-height:1.9";details.append(production);details.append(el("p",x.review?.status==="approved"?"✓ معتمد":x.review?.status==="revision"?"يحتاج تعديل: "+x.review.note:"بانتظار الاعتماد"));const note=el("textarea","");note.placeholder="ملاحظاتك أو التعديل المطلوب";note.maxLength=4000;details.append(note);for(const [status,label] of [["approved","اعتماد السيناريو"],["revision","طلب تعديل"]]){const b=el("button",label);b.onclick=async()=>{if(status==="revision"&&!note.value.trim()){note.focus();return}b.disabled=true;try{await api({action:"review",id:x.id,status,note:note.value});$("notice").textContent=status==="approved"?"تم الاعتماد بنجاح ✨":"تم إرسال ملاحظاتك";await load();if(status==="approved")celebrate(b)}catch(e){$("notice").textContent=e.message}finally{b.disabled=false}};details.append(b)}card.append(details);$("scripts").append(card)}renderFeedback([...(complete(selectedWeek)?[selectedWeek]:[]),...([1,2,3,4].every(complete)?[0]:[])]).catch(()=>{$("feedback").textContent="تعذر تحميل التقييم، أعيدي فتح الأسبوع"})}$("form").onsubmit=async e=>{e.preventDefault();$("submit").disabled=true;try{const r=await fetch(base+"client-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({slug:"evara",pin:$("pin").value})});const j=await r.json();if(!r.ok||!j.ok)throw Error("تعذر الدخول، تحققي من الرمز");token=j.token;await load()}catch(e){$("status").textContent=e.message}finally{$("pin").value="";$("submit").disabled=false}};$("logout").onclick=()=>{token="";location.reload()};function celebrate(b){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;for(let i=0;i<22;i++){const e=el("span",i%2?"✦":"✧");e.className="spark";e.style.left="50%";e.style.top="50%";e.style.setProperty("--x",Math.cos(i*2.4)*(70+i*7)+"px");e.style.setProperty("--y",Math.sin(i*2.4)*(70+i*7)+"px");document.body.append(e);setTimeout(()=>e.remove(),950)}}async function feedbackApi(body){const r=await fetch(base+"client-feedback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body,token})});const j=await r.json();if(!r.ok||!j.ok)throw Error("تعذر حفظ التقييم");return j.data}let feedbackRun=0;async function renderFeedback(periods){const run=++feedbackRun,host=$("feedback");host.replaceChildren();if(!periods.length)return;const saved=await feedbackApi({action:"list"});if(run!==feedbackRun)return;for(const period of periods){const card=el("article","");card.style.cssText="background:#eae8dd;text-align:center;padding:20px";const h=el("h2",period?"أسبوع من الإبداع معكم":"شهر من الإبداع معكم");h.style.cssText="background:#51553a;color:white;padding:18px;border-radius:14px";const brand=el("p","NAN SUNSHINE ☀︎");brand.style.cssText="color:#8061a8;font-weight:bold;letter-spacing:2px";card.append(brand,h);if(saved.some(x=>x.period===period)){card.append(el("p","وصلنا نوركم! شكرًا لتقييمكم ☀︎"));host.append(card);continue}card.append(el("p","سعدنا بكل فكرة صنعناها مع إيفارا، والحين جاء دوركم تنورون تجربتنا برأيكم"),el("h3","كم شمس تستحق تجربتنا؟"));let rating=0;const stars=el("div",""),label=el("p","اختاروا تقييمكم"),note=el("textarea",""),send=el("button","أرسلوا لنا شمسكم ☀︎"),msg=el("p","");stars.style.cssText="display:flex;justify-content:center;gap:5px";const labels=["نقدر نكون أفضل","ما وصلنا لتوقعاتكم","تجربة جيدة","تجربة جميلة","خمس شموس من الإبداع!"];for(let i=1;i<=5;i++){const b=el("button","☀︎");b.style.cssText="width:auto;background:transparent;border:0;color:#BDBDB5;font-size:36px;padding:4px";b.setAttribute("aria-label",i+" شموس");b.setAttribute("aria-pressed","false");b.onclick=()=>{rating=i;label.textContent=labels[i-1];send.disabled=false;[...stars.children].forEach((x,j)=>{x.style.color=j<i?"#9B7AC7":"#BDBDB5";x.setAttribute("aria-pressed",String(j<i))})};stars.append(b)}note.placeholder="اكتبوا لنا ما لا تقوله الشموس...";note.maxLength=4000;note.rows=4;send.disabled=true;send.style.cssText="background:#51553a;color:white";send.onclick=async()=>{send.disabled=true;try{await feedbackApi({action:"submit",period,rating,note:note.value});await renderFeedback(periods)}catch{msg.textContent="تعذر إرسال التقييم، حاولوا مرة أخرى";send.disabled=false}};card.append(stars,label,note,send,el("p","تقييمكم خاص بين إيفارا ونان استوديو"),msg);host.append(card)}} </script></body></html>
