)}const card=el("article",""),details=el("details","");details.append(el("summary",x.number+". "+x.title));const c=x.content;for(const [k,v] of [["المدة",c.duration],["الشخصيات",c.cast],["الأدوات",c.props]])details.append(el("p",k+": "+(v||"")));for(const scene of c.scenes||[])details.append(el("p",scene));details.append(el("p","النهاية: "+(c.ending||"")));card.append(details,el("p",x.review?.status==="approved"?"✓ معتمد":x.review?.status==="revision"?"يحتاج تعديل: "+x.review.note:"بانتظار الاعتماد"));const note=el("textarea","");note.placeholder="ملاحظاتك أو التعديل المطلوب";note.maxLength=4000;card.append(note);for(const [status,label] of [["approved","اعتماد السيناريو"],["revision","طلب تعديل"]]){const b=el("button",label);b.onclick=async()=>{if(status==="revision"&&!note.value.trim()){note.focus();return}b.disabled=true;try{await api({action:"review",id:x.id,status,note:note.value});$("notice").textContent=status==="approved"?"تم الاعتماد بنجاح ✨":"تم إرسال ملاحظاتك";await load();if(status==="approved")celebrate(b)}catch(e){$("notice").textContent=e.message}finally{b.disabled=false}};card.append(b)}$("scripts").append(card)}}$("form").onsubmit=async e=>{e.preventDefault();$("submit").disabled=true;try{const r=await fetch(base+"client-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({slug:"evara",pin:$("pin").value})});const j=await r.json();if(!r.ok||!j.ok)throw Error("تعذر الدخول، تحققي من الرمز");token=j.token;await load()}catch(e){$("status").textContent=e.message}finally{$("pin").value="";$("submit").disabled=false}};$("logout").onclick=()=>{token="";location.reload()};function celebrate(b){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;for(let i=0;i<22;i++){const e=el("span",i%2?"✦":"✧");e.className="spark";e.style.left="50%";e.style.top="50%";e.style.setProperty("--x",Math.cos(i*2.4)*(70+i*7)+"px");e.style.setProperty("--y",Math.sin(i*2.4)*(70+i*7)+"px");document.body.append(e);setTimeout(()=>e.remove(),950)}}</script></body></html>
