<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EVARA × NAN STUDIO</title><style>*{box-sizing:border-box}body{margin:0;background:#51553a;color:#f5f3e9;font-family:system-ui;min-height:100dvh;display:grid;place-items:center}main{width:min(420px,90vw);padding:30px;text-align:center}header{font:36px Georgia,serif;letter-spacing:7px}small{display:block;font:11px system-ui;letter-spacing:3px;margin:12px}h1{font:30px Georgia,serif;margin-top:45px}p{line-height:1.8}input,button{width:100%;padding:16px;border-radius:10px;font:inherit;margin:8px 0}input{background:#45492f;color:white;border:1px solid #aaa98e;text-align:center;letter-spacing:8px}button{background:#f5f3e9;color:#51553a;border:0;cursor:pointer}footer{margin-top:48px;font-size:12px;letter-spacing:2px}</style></head><body><main><header>EVARA<small>JEWELRY</small></header><h1>مساحتكم الإبداعية</h1><p>أهلًا بإيفارا، أدخلي رمز الدخول الخاص بمساحتك.</p><form id="form"><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required aria-label="رمز الدخول" autocomplete="off" placeholder="••••••" dir="ltr"><button id="submit">دخول إلى مساحتي</button></form><p id="status" role="status"></p><footer>EVARA × NAN STUDIO<p>المألوف لا يشبهنا</p></footer></main><script>const form=document.getElementById("form"),pin=document.getElementById("pin"),status=document.getElementById("status"),button=document.getElementById("submit");form.onsubmit=async e=>{e.preventDefault();button.disabled=true;status.textContent="جاري التحقق…";try{const r=await fetch("https://zyxgqkojiwmlzddtucpa.supabase.co/functions/v1/client-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({slug:"evara",pin:pin.value})});status.textContent=r.ok?"تم التحقق. المحتوى قيد التجهيز.":"تعذر الدخول. تحققي من الرمز أو حاولي لاحقًا."}catch{status.textContent="تعذر الاتصال."}finally{pin.value="";button.disabled=false}};</script></body></html>
