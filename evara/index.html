<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EVARA × NAN STUDIO</title><style>*{box-sizing:border-box}body{margin:0;background:#51553a;color:#f5f3e9;font-family:system-ui;min-height:100dvh;display:grid;place-items:center}main{width:min(420px,90vw);padding:30px;text-align:center}header{font:36px Georgia,serif;letter-spacing:7px}small{display:block;font:11px system-ui;letter-spacing:3px;margin:12px}h1{font:30px Georgia,serif;margin-top:45px}p{line-height:1.8}input,button{width:100%;padding:16px;border-radius:10px;font:inherit;margin:8px 0}input{background:#45492f;color:white;border:1px solid #aaa98e;text-align:center;letter-spacing:8px}button{background:#f5f3e9;color:#51553a;border:0;cursor:pointer}footer{margin-top:48px;font-size:12px;letter-spacing:2px}</style><style>[hidden]{display:none!important}main:has(#portal:not([hidden])){width:min(740px,96vw)}article{background:#f5f3e9;color:#45492f;border-radius:18px;padding:20px;margin:16px 0;text-align:right}article button{background:#51553a;color:#fff}textarea{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid #aaa98e}summary{cursor:pointer;font-weight:600}button:disabled{opacity:.5}article p{white-space:pre-wrap}</style></head><body><main><header>EVARA<small>JEWELRY</small></header><section id="login"><h1>مساحتكم الإبداعية</h1><p>أهلًا بإيفارا، أدخلي رمز الدخول الخاص بمساحتك.</p><form id="form"><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required aria-label="رمز الدخول" autocomplete="off" placeholder="••••••" dir="ltr"><button id="submit">دخول إلى مساحتي</button></form><p id="status" role="status"></p></section><section id="portal" hidden><small>EVARA × NAN STUDIO</small><h1>شهر كامل خارج المألوف</h1><p>خطة محتوى إبداعية لشهر كامل، تضم 30 سيناريو صُممت خصيصًا لإيفارا.</p><p id="progress"></p><div id="scripts"></div><p id="notice" role="status"></p><button id="logout">تسجيل الخروج</button></section><footer>EVARA × NAN STUDIO<p>المألوف لا يشبهنا</p></footer></main><script>const $=id=>document.getElementById(id),base="https://zyxgqkojiwmlzddtucpa.supabase.co/functions/v1/";let token="";async function api(body){const r=await fetch(base+"portal-api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body,token})});const j=await r.json();if(!r.ok||!j.ok)throw Error("تعذر تنفيذ الطلب. تحققي من الجلسة.");return j.data}function el(tag,t){const x=document.createElement(tag);x.textContent=t;return x}async function load(){const rows=await api({action:"list"});$("login").hidden=true;$("portal").hidden=false;$("progress").textContent=rows.filter(x=>x.review?.status==="approved").length+" / 30 سيناريو معتمد";$("scripts").replaceChildren();if(!rows.length)$("scripts").append(el("p","لا توجد سيناريوهات منشورة حاليًا."));let week=0;for(const x of rows){if(x.week!==week){week=x.week;$("scripts").append(el("h2","الأسبوع "+week))}const card=el("article",""),details=el("details","");details.append(el("summary",x.number+". "+x.title));const c=x.content;for(const [k,v] of [["المدة",c.duration],["الشخصيات",c.cast],["الأدوات",c.props]])details.append(el("p",k+": "+(v||"")));for(const scene of c.scenes||[])details.append(el("p",scene));details.append(el("p","النهاية: "+(c.ending||"")));card.append(details,el("p",x.review?.status==="approved"?"✓ معتمد":x.review?.status==="revision"?"يحتاج تعديل: "+x.review.note:"بانتظار الاعتماد"));const note=el("textarea","");note.placeholder="ملاحظاتك أو التعديل المطلوب";note.maxLength=4000;card.append(note);for(const [status,label] of [["approved","اعتماد السيناريو"],["revision","طلب تعديل"]]){const b=el("button",label);b.onclick=async()=>{if(status==="revision"&&!note.value.trim()){note.focus();return}b.disabled=true;try{await api({action:"review",id:x.id,status,note:note.value});$("notice").textContent=status==="approved"?"تم الاعتماد بنجاح ✨":"تم إرسال ملاحظاتك";await load()}catch(e){$("notice").textContent=e.message}finally{b.disabled=false}};card.append(b)}$("scripts").append(card)}}$("form").onsubmit=async e=>{e.preventDefault();$("submit").disabled=true;try{const r=await fetch(base+"client-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({slug:"evara",pin:$("pin").value})});const j=await r.json();if(!r.ok||!j.ok)throw Error("تعذر الدخول، تحققي من الرمز");token=j.token;await load()}catch(e){$("status").textContent=e.message}finally{$("pin").value="";$("submit").disabled=false}};$("logout").onclick=()=>{token="";location.reload()};</script></body></html>
